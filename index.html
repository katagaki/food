<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161616">
<title>One-Pan Food</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<button class="back-btn" id="backBtn" aria-label="Back to recipes">
  <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12.5 4 6.5 10l6 6"/>
  </svg>
</button>

<aside class="sidenav" id="sidenav" aria-label="Recipes">
  <a class="sidenav-title" href="#/">One-Pan Food</a>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor">
      <path d="M15 14.3 10.7 10a5.8 5.8 0 1 0-.7.7L14.3 15ZM2 6.5A4.5 4.5 0 1 1 6.5 11 4.5 4.5 0 0 1 2 6.5Z"/>
    </svg>
    <input type="search" id="search" placeholder="Search recipes" autocomplete="off" aria-label="Search recipes">
  </div>

  <div class="list-controls">
    <div class="seg" role="group" aria-label="Sort recipes">
      <button type="button" class="seg-btn" data-sort="title" aria-pressed="true">A to Z</button>
      <button type="button" class="seg-btn" data-sort="time" aria-pressed="false">Quickest</button>
    </div>
    <button type="button" class="filter-chip" id="triedFilter" aria-pressed="false">
      <span class="chip-box">
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 8.5 6.5 11.5 12.5 4.5"/>
        </svg>
      </span>
      Human tested
    </button>
  </div>

  <nav>
    <ul class="recipe-list" id="recipeList"></ul>
  </nav>

  <p class="sidenav-footer">Recipes on this page were all written by Claude. Verify important information.</p>
</aside>

<main class="content" id="content" tabindex="-1"></main>

<script src="js/app.js"></script>
</body>
</html>
