<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A starburst wearing a chef's hat">
  <!-- Starburst -->
  <g stroke="#d97757" stroke-width="5.5" stroke-linecap="round">
    <line x1="32" y1="40" x2="32" y2="58"/>
    <line x1="32" y1="40" x2="46" y2="54"/>
    <line x1="32" y1="40" x2="18" y2="54"/>
    <line x1="32" y1="40" x2="54" y2="44"/>
    <line x1="32" y1="40" x2="10" y2="44"/>
    <line x1="32" y1="40" x2="55" y2="32"/>
    <line x1="32" y1="40" x2="9" y2="32"/>
